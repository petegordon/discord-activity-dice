<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshots · 7, 11, Doubles</title>
    <meta name="description" content="Screenshots of 7, 11, Doubles: shake your phone and throw 3D dice with friends." />
    <meta property="og:title" content="7, 11, Doubles" />
    <meta property="og:description" content="Shake your phone and throw 3D dice with friends, on the web or in Discord." />
    <meta property="og:image" content="https://dice.housetandem.com/screenshots/desktop.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/legal.css" />
    <style>
      main {
        max-width: 1100px;
      }
      .lede {
        color: var(--muted);
        margin: 4px 0 0;
      }
      .cta {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 12px;
        background: var(--gold);
        color: #1d1606;
        font-weight: 700;
        text-decoration: none;
      }
      .hero {
        margin: 24px 0 8px;
      }
      .hero img {
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
        display: block;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      figure {
        margin: 0;
      }
      figure img {
        width: 100%;
        height: auto;
        border-radius: 14px;
        border: 1px solid var(--line);
        display: block;
        background: var(--panel);
      }
      figcaption {
        margin-top: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      figcaption b {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>7, 11, Doubles</h1>
        <p class="lede">Shake your phone, throw the dice. Roll 7 or 11 for +1, doubles for +2. Hit and you roll again.</p>
        <a class="cta" href="/">Play now</a>
      </header>

      <figure class="hero">
        <img src="desktop.png" width="1280" height="800" alt="Desktop view: the dice have landed on a scoring roll and the callout says roll again" />
        <figcaption><b>Desktop:</b> plays in any browser, or as an Activity inside Discord voice channels.</figcaption>
      </figure>

      <div class="grid">
        <figure>
          <a href="lobby.png"><img src="lobby.png" width="780" height="1688" loading="lazy" alt="Lobby with three players and the first-to-10 target picker" /></a>
          <figcaption><b>Lobby:</b> share the invite link, pick a target, start.</figcaption>
        </figure>
        <figure>
          <a href="shaking.png"><img src="shaking.png" width="780" height="1688" loading="lazy" alt="Holding the cup to shake the dice before a throw" /></a>
          <figcaption><b>Hold &amp; shake:</b> shake your phone, then flick it to throw.</figcaption>
        </figure>
        <figure>
          <a href="rolling.png"><img src="rolling.png" width="780" height="1688" loading="lazy" alt="Two red dice tumbling across the green felt table" /></a>
          <figcaption><b>Rolling:</b> everyone sees the same dice tumble.</figcaption>
        </figure>
        <figure>
          <a href="seven.png"><img src="seven.png" width="780" height="1688" loading="lazy" alt="Dice totalling seven with the callout SEVEN! +1, roll again" /></a>
          <figcaption><b>Seven:</b> +1, roll again.</figcaption>
        </figure>
        <figure>
          <a href="eleven.png"><img src="eleven.png" width="780" height="1688" loading="lazy" alt="Dice showing 5 and 6 with the callout YO-LEVEN! +1, roll again" /></a>
          <figcaption><b>Yo-leven:</b> +1, roll again.</figcaption>
        </figure>
        <figure>
          <a href="doubles.png"><img src="doubles.png" width="780" height="1688" loading="lazy" alt="Two dice showing the same number with a DOUBLE callout, +2, roll again" /></a>
          <figcaption><b>Doubles:</b> worth double, +2.</figcaption>
        </figure>
        <figure>
          <a href="win.png"><img src="win.png" width="780" height="1688" loading="lazy" alt="Win screen with a trophy, You win!, and the final scores" /></a>
          <figcaption><b>Winner:</b> first to the target takes it.</figcaption>
        </figure>
      </div>

      <nav>
        <a href="/">Play 7, 11, Doubles</a>
        <a href="https://github.com/petegordon/discord-activity-dice">Source on GitHub</a>
        <a href="/terms">Terms</a>
        <a href="/privacy">Privacy</a>
      </nav>
    </main>
  </body>
</html>

    <main>
      <header>
        <h1>7, 11, Doubles</h1>
        <p class="lede">Shake your phone, throw the dice. Roll 7 or 11 for +1, doubles for +2. Hit and you roll again.</p>
        <div class="ctas">
          <a class="cta" href="/">Play in your browser</a>
          <a class="cta alt" href="https://discord.com/activities/1560074262008700930" rel="noopener">Play in Discord</a>
          <a class="cta plain" href="https://discord.com/oauth2/authorize?client_id=1560074262008700930" rel="noopener">Add to your Discord server</a>
        </div>
      </header>

      <section class="reels" aria-label="Demo reel">
        <figure>
          <video controls playsinline preload="metadata" poster="demo-reel.jpg" width="1920" height="1080">
            <source src="demo-reel.mp4" type="video/mp4" />
          </video>
          <figcaption><b>Demo reel:</b> real games, real rolls. Three friends on their phones, then a laptop table with a phone as the dice cup. <a href="demo-reel.mp4" download>Download (1920×1080)</a></figcaption>
        </figure>
        <figure class="tall">
          <video controls playsinline preload="metadata" poster="demo-reel-vertical.jpg" width="1080" height="1920">

          </video>
          <figcaption><b>Vertical:</b> for TikTok, Reels and Shorts. <a href="demo-reel-vertical.mp4" download>Download (1080×1920)</a></figcaption>
        </figure>

      <figure class="hero">
        <img src="desktop.png" width="1280" height="800" alt="Desktop view: the dice have landed on a scoring roll and the callout says roll again" />
        <figcaption><b>Desktop:</b> plays in any browser, or as an Activity inside Discord voice channels.</figcaption>
      </figure>

      <div class="grid">
        <figure>
          <a href="lobby.png"><img src="lobby.png" width="780" height="1688" loading="lazy" alt="Lobby with three players and the first-to-10 target picker" /></a>
          <figcaption><b>Lobby:</b> share the invite link, pick a target, start.</figcaption>
        </figure>
        <figure>
          <a href="shaking.png"><img src="shaking.png" width="780" height="1688" loading="lazy" alt="Holding the cup to shake the dice before a throw" /></a>
          <figcaption><b>Hold &amp; shake:</b> shake your phone, then flick it to throw.</figcaption>
        </figure>
        <figure>

        </figure>
        <figure>

          <figcaption><b>Seven:</b> +1, roll again.</figcaption>
        </figure>
        <figure>
          <a href="eleven.png"><img src="eleven.png" width="780" height="1688" loading="lazy" alt="Dice showing 5 and 6 with the callout YO-LEVEN! +1, roll again" /></a>
          <figcaption><b>Yo-leven:</b> +1, roll again.</figcaption>
        </figure>
        <figure>
